name: Get Refresh Token

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Auth Link
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        run: |
          CLIENT_ID=$(echo "${GDRIVE_CLIENT_ID}" | xargs)
          SCOPE="https://www.googleapis.com/auth/drive"
          REDIRECT_URI="https://developers.google.com/oauthplayground"
          
          if [ -z "$CLIENT_ID" ]; then
            echo "錯誤：GDRIVE_CLIENT_ID 為空，請檢查 GitHub Secrets 設定！"
            exit 1
          fi

          AUTH_URL="https://accounts.google.com/o/oauth2/v2/auth?response_type=code&client_id=${CLIENT_ID}&redirect_uri=${REDIRECT_URI}&scope=${SCOPE}&access_type=offline&prompt=consent"

          echo "=================================================="
          echo "請複製以下網址至瀏覽器開啟進行授權："
          echo "$AUTH_URL"
          echo "=================================================="
