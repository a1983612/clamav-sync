name: ClamAV Daily Sync to Google Drive

on:
  schedule:
    # 每日 UTC 18:00 (相當於台灣時間/CST 凌晨 02:00) 自動觸發
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動測試執行

jobs:
  update-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ClamAV Freshclam & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-freshclam
          pip install pydrive2 google-api-python-client google-auth

      - name: Download ClamAV files using Freshclam
        run: |
          echo "停止系統背景 freshclam 服務以釋放檔案鎖定..."
          sudo systemctl stop clamav-freshclam.service || true
          
          echo "開始透過 freshclam 官方工具抓取 ClamAV 病毒碼..."
          sudo freshclam

      - name: Upload to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -c '
          import os, json
          from pydrive2.auth import GoogleAuth
          from pydrive2.drive import GoogleDrive

          cvd_dir = "/var/lib/clamav"
          files = ["daily.cvd", "main.cvd", "bytecode.cvd"]

          # 1. 解析憑證並透過 Service Account 登入
          creds_dict = json.loads(os.environ["GDRIVE_CREDENTIALS"])
          
          # 寫入臨時憑證檔供 PyDrive2 讀取
          with open("client_secrets.json", "w") as f:
              json.dump(creds_dict, f)

          gauth = GoogleAuth()
          gauth.settings = {
              "client_config_backend": "service",
              "service_config": {
                  "client_json_file_path": "client_secrets.json"
              }
          }
          gauth.ServiceAuth()
          drive = GoogleDrive(gauth)
          folder_id = os.environ["GDRIVE_FOLDER_ID"]

          # 2. 上傳檔案至 Google Drive
          for file_name in files:
              file_path = os.path.join(cvd_dir, file_name)
              if not os.path.exists(file_path):
                  print(f"警告：未找到 {file_path}，跳過上傳。")
                  continue

              # 查詢舊檔並刪除
              file_list = drive.ListFile({
                  "q": f"\"{folder_id}\" in parents and title = \"{file_name}\" and trashed = false"
              }).GetList()

              for old_file in file_list:
                  old_file.Delete()
                  print(f"已清理舊檔案: {file_name} (ID: {old_file[\"id\"]})")

              # 上傳新檔
              new_file = drive.CreateFile({
                  "title": file_name,
                  "parents": [{"id": folder_id}]
              })
              new_file.SetContentFile(file_path)
              # 設定由父資料夾配額繼承，避免占用 Service Account 空間
              new_file.Upload(param={"supportsAllDrives": True, "supportsTeamDrives": True})
              print(f"成功上傳至 Google Drive: {file_name} (ID: {new_file[\"id\"]})")
              
          # 清理臨時憑證
          if os.path.exists("client_secrets.json"):
              os.remove("client_secrets.json")
          '
