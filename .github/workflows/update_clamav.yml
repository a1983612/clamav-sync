name: ClamAV Daily Sync to Google Drive

on:
  schedule:
    # 每日 UTC 18:00 (相當於台灣時間/CST 凌晨 02:00) 自動觸發
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動測試執行

jobs:
  update-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ClamAV Freshclam & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-freshclam
          pip install google-api-python-client google-auth

      - name: Download ClamAV files using Freshclam
        run: |
          echo "停止系統背景 freshclam 服務以釋放檔案鎖定..."
          sudo systemctl stop clamav-freshclam.service || true
          
          echo "開始透過 freshclam 官方工具抓取 ClamAV 病毒碼..."
          sudo freshclam

      - name: Upload to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python -c '
          import os, json
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          cvd_dir = "/var/lib/clamav"
          files = ["daily.cvd", "main.cvd", "bytecode.cvd"]

          # 1. 驗證連線 Google Drive API
          creds_dict = json.loads(os.environ["GDRIVE_CREDENTIALS"])
          creds = Credentials.from_service_account_info(
              creds_dict, 
              scopes=["https://www.googleapis.com/auth/drive"]
          )
          service = build("drive", "v3", credentials=creds)
          folder_id = os.environ["GDRIVE_FOLDER_ID"]

          # 取得資料夾擁有者的 Email (即您的個人 Google 帳號 Email)
          folder_info = service.files().get(fileId=folder_id, fields="owners").execute()
          owner_email = folder_info.get("owners", [{}])[0].get("emailAddress")
          print(f"目標資料夾擁有者 Email: {owner_email}")

          # 2. 上傳檔案至 Google Drive
          for file_name in files:
              file_path = os.path.join(cvd_dir, file_name)
              if not os.path.exists(file_path):
                  print(f"警告：未找到 {file_path}，跳過上傳。")
                  continue

              # 查詢舊檔並刪除 (提取變數，避開 f-string 反斜線問題)
              query = f"\"{folder_id}\" in parents and name = \"{file_name}\" and trashed = false"
              results = service.files().list(q=query, fields="files(id, name)").execute()
              existing_files = results.get("files", [])
              
              for old_file in existing_files:
                  old_id = old_file["id"]
                  service.files().delete(fileId=old_id).execute()
                  print(f"已清理舊檔案: {file_name} (ID: {old_id})")

              # 上傳新檔
              file_metadata = {"name": file_name, "parents": [folder_id]}
              media = MediaFileUpload(file_path, resumable=True)
              new_file = service.files().create(
                  body=file_metadata, 
                  media_body=media, 
                  fields="id"
              ).execute()
              new_id = new_file.get("id")

              # 轉移檔案擁有權給個人帳號，徹底解決 Service Account 0 MB 空間配額問題
              if owner_email:
                  try:
                      permission = {
                          "type": "user",
                          "role": "owner",
                          "emailAddress": owner_email
                      }
                      service.permissions().create(
                          fileId=new_id,
                          body=permission,
                          transferOwnership=True
                      ).execute()
                  except Exception as e:
                      print(f"轉移擁有權提示: {e}")

              print(f"成功上傳至 Google Drive: {file_name} (ID: {new_id})")
          '
