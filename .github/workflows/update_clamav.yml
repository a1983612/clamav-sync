name: ClamAV Daily Sync to Google Drive

on:
  schedule:
    # 每日 UTC 18:00 (相當於台灣時間/CST 凌晨 02:00) 自動觸發
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動測試執行

jobs:
  update-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 升級至 Python 3.11 避免 Google SDK 警示

      - name: Install ClamAV Freshclam & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-freshclam
          pip install google-api-python-client google-auth

      - name: Download ClamAV files using Freshclam
        run: |
          # 建立存放目錄並賦予完整寫入權限，解決 UID 113 寫入失敗的問題
          mkdir -p ./cvd_files
          sudo chmod 777 ./cvd_files
          
          # 設定 freshclam 設定檔
          echo "DatabaseDirectory $(pwd)/cvd_files" | sudo tee /etc/clamav/freshclam.conf
          echo "DatabaseMirror database.clamav.net" | sudo tee -a /etc/clamav/freshclam.conf
          
          echo "開始透過 freshclam 官方工具抓取 ClamAV 病毒碼..."
          sudo freshclam --config-file=/etc/clamav/freshclam.conf
